<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interests Received &amp; Sent – EVA Matrimony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
	<link href="/css/matrimony.css" rel="stylesheet">
    
</head>
<body class="eva-matrimony interests-page">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container flex-grow-1 py-4">
        <div class="interests-card animate-fade-up">

            <!-- Success/Error alert box -->
            <div th:if="${successMessage}" class="alert alert-success bg-success-subtle text-success border-0 rounded-3 mb-4 py-3" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger bg-danger-subtle text-danger border-0 rounded-3 mb-4 py-3" th:text="${errorMessage}"></div>

            <h3 class="brand-font text-gold mb-4 text-center">Connection Interests</h3>

            <!-- Tabs Nav -->
            <ul class="nav nav-tabs justify-content-center" id="interestsTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="received-tab" data-bs-toggle="tab" data-bs-target="#received" type="button" role="tab" aria-controls="received" aria-selected="true">
                        Received Interests (<span th:text="${#lists.size(receivedInterests)}">0</span>)
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="sent-tab" data-bs-toggle="tab" data-bs-target="#sent" type="button" role="tab" aria-controls="sent" aria-selected="false">
                        Sent Interests (<span th:text="${#lists.size(sentInterests)}">0</span>)
                    </button>
                </li>
            </ul>

            <!-- Tabs Content -->
            <div class="tab-content" id="interestsTabsContent">
                <!-- Received tab -->
                <div class="tab-pane fade show active" id="received" role="tabpanel" aria-labelledby="received-tab">
                    <div class="text-center py-5" th:if="${#lists.isEmpty(receivedInterests)}">
                        <span style="font-size: 3rem;">📥</span>
                        <p class="text-white-50 mt-3">No interest requests received yet.</p>
                    </div>

                    <div th:each="mi : ${receivedInterests}" class="interest-row">
                        <div>
                            <h5 class="brand-font mb-1 text-gold" th:text="${mi.sender.name}">Sender Name</h5>
                            <span class="small text-white-50">Sent on: </span>
                            <span class="small text-white-50 fw-bold" th:text="${#temporals.format(mi.createdAt, 'dd MMM yyyy')}">Date</span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <!-- Pending states actions -->
                            <div th:if="${mi.status == T(com.llbeauty.enums.InterestStatus).PENDING}" class="d-flex gap-2">
                                <form th:action="@{/matrimony/interests/accept/{id}(id=${mi.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-gold rounded-pill px-3">Accept</button>
                                </form>
                                <form th:action="@{/matrimony/interests/reject/{id}(id=${mi.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">Decline</button>
                                </form>
                            </div>
                            <!-- Accepted state -->
                            <div th:if="${mi.status == T(com.llbeauty.enums.InterestStatus).ACCEPTED}">
                                <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">ACCEPTED</span>
                            </div>
                            <!-- Rejected state -->
                            <div th:if="${mi.status == T(com.llbeauty.enums.InterestStatus).REJECTED}">
                                <span class="badge bg-secondary-subtle text-white-50 px-3 py-2 rounded-pill">DECLINED</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sent tab -->
                <div class="tab-pane fade" id="sent" role="tabpanel" aria-labelledby="sent-tab">
                    <div class="text-center py-5" th:if="${#lists.isEmpty(sentInterests)}">
                        <span style="font-size: 3rem;">📤</span>
                        <p class="text-white-50 mt-3">You haven't sent any interest requests yet.</p>
                    </div>

                    <div th:each="mi : ${sentInterests}" class="interest-row">
                        <div>
                            <h5 class="brand-font mb-1 text-gold" th:text="${mi.receiver.name}">Receiver Name</h5>
                            <span class="small text-white-50">Sent on: </span>
                            <span class="small text-white-50 fw-bold" th:text="${#temporals.format(mi.createdAt, 'dd MMM yyyy')}">Date</span>
                        </div>
                        <div>
                            <span class="badge bg-warning-subtle text-warning px-3 py-2 rounded-pill" th:if="${mi.status == T(com.llbeauty.enums.InterestStatus).PENDING}">PENDING</span>
                            <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill" th:if="${mi.status == T(com.llbeauty.enums.InterestStatus).ACCEPTED}">ACCEPTED</span>
                            <span class="badge bg-danger-subtle text-danger px-3 py-2 rounded-pill" th:if="${mi.status == T(com.llbeauty.enums.InterestStatus).REJECTED}">DECLINED</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Action link -->
            <div class="text-center mt-5">
                <a href="/matrimony" class="btn btn-outline-light px-4 rounded-pill">
                    <i class="bi bi-arrow-left me-1"></i> Back to Matrimony
                </a>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
