<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrimony Profile - Step 5 – EVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
	<link href="/css/matrimony.css" rel="stylesheet">
    <style>
        .wizard-page {
            background-color: #0c0c0c;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .wizard-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(201, 168, 76, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 60px auto;
            max-width: 800px;
            width: 100%;
        }
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
        }
        .stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 5%;
            right: 5%;
            height: 2px;
            background: rgba(255,255,255,0.1);
            z-index: 1;
        }
        .step-node {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #111;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }
        .step-node.active {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
            box-shadow: 0 0 15px rgba(201,168,76,0.4);
        }
        .step-node.completed {
            background: #2ecc71;
            border-color: #2ecc71;
            color: #fff;
        }
        .step-label {
            position: absolute;
            top: 45px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            color: rgba(255,255,255,0.4);
        }
        .step-node.active .step-label {
            color: var(--gold);
            font-weight: 600;
        }
        .form-control {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff !important;
            border-radius: 10px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.05);
            border-color: var(--gold);
            box-shadow: 0 0 8px rgba(201,168,76,0.25);
        }
        .form-label {
            font-weight: 500;
            font-size: 0.88rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 8px;
        }
    </style>
</head>
<body class="eva-matrimony wizard-page">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container flex-grow-1 d-flex align-items-center">
        <div class="wizard-card animate-fade-up">
            
            <!-- Stepper Header -->
            <div class="stepper">
                <div class="step-node completed">1<span class="step-label">Basic</span></div>
                <div class="step-node completed">2<span class="step-label">Religion</span></div>
                <div class="step-node completed">3<span class="step-label">Career</span></div>
                <div class="step-node completed">4<span class="step-label">Family</span></div>
                <div class="step-node active">5<span class="step-label">About</span></div>
                <div class="step-node">6<span class="step-label">Photo</span></div>
            </div>

            <h3 class="brand-font mb-4 text-center" style="color: #c9a84c;">Step 5: About Me</h3>
            
            <form th:action="@{/matrimony/profile/step5}" method="post">
                <div class="row g-4">
                    <!-- About Me -->
                    <div class="col-md-12">
                        <label for="aboutMe" class="form-label">Write about yourself * (Min 50 characters)</label>
                        <textarea class="form-control" id="aboutMe" name="aboutMe" rows="8" placeholder="Share your personality, hobbies, life goals, values, and what you are looking for in a partner..." minlength="50" required th:text="${profile != null ? profile.aboutMe : ''}"></textarea>
                    </div>

                    <!-- Navigation buttons -->
                    <div class="col-12 mt-5 d-flex justify-content-between">
                        <a href="/matrimony/profile/step4" class="btn btn-outline-light px-4 rounded-pill">Previous</a>
                        <button type="submit" class="btn-gold rounded-pill px-5 py-2.5">Save &amp; Continue</button>
                    </div>
                </div>
            </form>

        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
