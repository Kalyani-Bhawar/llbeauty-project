<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrimony Profile - Step 6 – EVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
	<link href="/css/matrimony.css" rel="stylesheet">
    <style>
        .wizard-page {
            background-color: #0c0c0c;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .wizard-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(201, 168, 76, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 60px auto;
            max-width: 800px;
            width: 100%;
        }
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
        }
        .stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 5%;
            right: 5%;
            height: 2px;
            background: rgba(255,255,255,0.1);
            z-index: 1;
        }
        .step-node {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #111;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }
        .step-node.active {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
            box-shadow: 0 0 15px rgba(201,168,76,0.4);
        }
        .step-node.completed {
            background: #2ecc71;
            border-color: #2ecc71;
            color: #fff;
        }
        .step-label {
            position: absolute;
            top: 45px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            color: rgba(255,255,255,0.4);
        }
        .step-node.active .step-label {
            color: var(--gold);
            font-weight: 600;
        }
        .upload-area {
            border: 2px dashed rgba(201,168,76,0.3);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: var(--gold);
            background: rgba(201,168,76,0.04);
        }
        .upload-preview {
            max-width: 250px;
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid var(--gold);
            box-shadow: var(--shadow-gold);
            display: none;
            margin: 20px auto;
        }
        .btn-gold {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--white);
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-decoration: none;
            line-height: 1.4;
        }
    </style>
</head>
<body class="eva-matrimony wizard-page">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container flex-grow-1 d-flex align-items-center">
        <div class="wizard-card animate-fade-up">
            
            <!-- Stepper Header -->
            <div class="stepper">
                <div class="step-node completed">1<span class="step-label">Basic</span></div>
                <div class="step-node completed">2<span class="step-label">Religion</span></div>
                <div class="step-node completed">3<span class="step-label">Career</span></div>
                <div class="step-node completed">4<span class="step-label">Family</span></div>
                <div class="step-node completed">5<span class="step-label">About</span></div>
                <div class="step-node active">6<span class="step-label">Photo</span></div>
            </div>

            <h3 class="brand-font mb-4 text-center" style="color: #c9a84c;">Step 6: Profile Photo</h3>
            
            <div th:if="${errorMessage}" class="alert alert-danger bg-danger-subtle text-danger border-0 rounded-3 mb-4" th:text="${errorMessage}"></div>

            <!-- Upload Zone -->
            <div class="upload-area mb-4" id="uploadZone">
                <i class="bi bi-camera-fill text-gold display-4 mb-3 d-block"></i>
                <h5 class="brand-font text-gold">Upload Your Profile Picture</h5>
                <p class="text-white-50 small">Drag &amp; drop or click to upload. Only JPG, PNG allowed.</p>
                <input type="file" id="fileInput" class="d-none" accept="image/*">
                
                <div class="spinner-border text-gold mt-3" role="status" id="uploadSpinner" style="display: none;">
                    <span class="visually-hidden">Uploading...</span>
                </div>
            </div>

            <!-- Upload Preview -->
            <img id="previewImage" class="upload-preview" alt="Profile Photo Preview" 
                 th:src="${profile != null && profile.profilePhoto != null ? profile.profilePhoto : ''}" 
                 th:style="${profile != null && profile.profilePhoto != null ? 'display: block;' : 'display: none;'}">

            <!-- Submission Form -->
            <form th:action="@{/matrimony/profile/step6}" method="post" id="photoForm">
                <!-- Hidden input field to store file URL -->
                <input type="hidden" id="profilePhoto" name="profilePhoto" th:value="${profile != null ? profile.profilePhoto : ''}">

                <!-- Navigation buttons -->
                <div class="col-12 mt-5 d-flex justify-content-between">
                    <a href="/matrimony/profile/step5" class="btn btn-outline-light px-4 rounded-pill">Previous</a>
                    <button type="submit" class="btn-gold rounded-pill px-5 py-2.5">Save &amp; Review</button>
                </div>
            </form>

        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- JS for Upload Integration -->
    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const uploadSpinner = document.getElementById('uploadSpinner');
        const previewImage = document.getElementById('previewImage');
        const profilePhotoHiddenInput = document.getElementById('profilePhoto');
        const photoForm = document.getElementById('photoForm');

        uploadZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            // Show loading spinner
            uploadSpinner.style.display = 'inline-block';

            fetch('/api/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => {
                if (!res.ok) throw new Error('Upload failed');
                return res.json();
            })
            .then(data => {
                uploadSpinner.style.display = 'none';
                if (data.url) {
                    profilePhotoHiddenInput.value = data.url;
                    previewImage.src = data.url;
                    previewImage.style.display = 'block';
                } else {
                    alert('Failed to get uploaded file URL');
                }
            })
            .catch(err => {
                uploadSpinner.style.display = 'none';
                alert('Upload failed: ' + err.message);
            });
        }
    </script>
</body>
</html>
