<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Partner – EVA Matrimony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
	<link href="/css/matrimony.css" rel="stylesheet">
    <style>
        .chat-page {
            background-color: #0c0c0c;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(201, 168, 76, 0.2);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            margin: 40px auto;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 600px;
            overflow: hidden;
        }
        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.01);
        }
        .chat-partner-img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
            border: 1.5px solid var(--gold);
        }
        .chat-history {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(0, 0, 0, 0.2);
        }
        .msg-bubble {
            max-width: 65%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .msg-sent {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        .msg-received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-input-area {
            padding: 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255,255,255,0.01);
        }
        .form-control {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff !important;
            border-radius: 30px;
            padding: 12px 24px;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.05);
            border-color: var(--gold);
            box-shadow: 0 0 8px rgba(201,168,76,0.25);
        }
    </style>
</head>
<body class="eva-matrimony chat-page">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container flex-grow-1 d-flex align-items-center">
        <div class="chat-container animate-fade-up">
            
            <!-- Header -->
            <div class="chat-header">
                <div class="d-flex align-items-center gap-3">
                    <img th:src="${partnerProfile.profilePhoto != null ? partnerProfile.profilePhoto : '/images/salon_hero.png'}" class="chat-partner-img" alt="Partner">
                    <div>
                        <h5 class="brand-font mb-0 text-gold" th:text="${partner.name}">Partner Name</h5>
                        <span class="small text-white-50">Active Match Connection</span>
                    </div>
                </div>
                <a href="/matrimony/matches" class="btn btn-sm btn-outline-light rounded-pill px-3">
                    <i class="bi bi-arrow-left"></i> Matches
                </a>
            </div>

            <!-- History -->
            <div class="chat-history" id="chatHistory">
                <div th:each="msg : ${chatHistory}" 
                     class="msg-bubble" 
                     th:classappend="${msg.sender.id == currentUser.id} ? 'msg-sent' : 'msg-received'"
                     th:text="${msg.message}">
                    Message content
                </div>
            </div>

            <!-- Input area -->
            <div class="chat-input-area">
                <form th:action="@{/matrimony/chat/send}" method="post" id="chatForm">
                    <input type="hidden" name="matchId" th:value="${match.id}">
                    <input type="hidden" name="receiverId" th:value="${partner.id}">
                    <div class="input-group">
                        <input type="text" class="form-control" name="message" id="messageInput" placeholder="Type a secure message..." autocomplete="off" required>
                        <button class="btn btn-gold rounded-pill px-4 ms-2" type="submit">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:inline="javascript">
        // Auto scroll to bottom of chat
        const chatHistory = document.getElementById('chatHistory');
        chatHistory.scrollTop = chatHistory.scrollHeight;

        const matchId = /*[[${match.id}]]*/ 0;
        const currentUserId = /*[[${currentUser.id}]]*/ 0;

        // Perform lightweight polling to refresh messages dynamically
        setInterval(() => {
            fetch('/matrimony/chat/history/' + matchId)
            .then(res => res.json())
            .then(messages => {
                // Clear and rebuild chat history dynamically
                chatHistory.innerHTML = '';
                messages.forEach(msg => {
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble ' + (msg.senderId === currentUserId ? 'msg-sent' : 'msg-received');
                    bubble.textContent = msg.message;
                    chatHistory.appendChild(bubble);
                });
                chatHistory.scrollTop = chatHistory.scrollHeight;
            })
            .catch(err => console.log('Error refreshing chat: ', err));
        }, 5000);
    </script>
</body>
</html>
