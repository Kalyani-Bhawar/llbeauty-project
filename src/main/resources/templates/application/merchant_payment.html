<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA Store - Merchant Deposit Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --eva-gold: #D4AF37;
            --eva-black: #111111;
            --eva-dark: #222222;
        }
        body {
            background-color: var(--eva-black);
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .eva-card {
            background-color: var(--eva-dark);
            border: 1px solid var(--eva-gold);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(212, 175, 55, 0.2);
        }
        .text-gold { color: var(--eva-gold) !important; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <h1 class="text-gold fw-bold mb-4">Complete Your Application</h1>
                <div class="eva-card p-5">
                    <h4 class="mb-4">Security Deposit Payment</h4>
                    <p class="text-muted mb-4">A refundable security deposit of <strong>₹50,000</strong> is required to proceed with your merchant application.</p>
                    
                    <form action="/apply/merchant/verify" method="POST" id="razorpayForm">
                        <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
                        <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
                        <input type="hidden" name="razorpay_signature" id="razorpay_signature">
                        <input type="hidden" name="applicationId" th:value="${applicationId}">
                    </form>

                    <button id="rzp-button" class="btn btn-warning w-100 py-3 fw-bold" style="background-color: var(--eva-gold); border: none;">
                        Pay ₹50,000 Now
                    </button>
                    
                    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script th:inline="javascript">
        var options = {
            "key": [[${keyId}]],
            "amount": [[${amount}]], 
            "currency": "INR",
            "name": "EVA Beauty",
            "description": "Merchant Security Deposit",
            "order_id": [[${orderId}]],
            "handler": function (response){
                document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
                document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
                document.getElementById('razorpay_signature').value = response.razorpay_signature;
                document.getElementById('razorpayForm').submit();
            },
            "prefill": {
                "name": [[${user.name}]],
                "email": [[${user.email}]],
                "contact": [[${user.mobile}]]
            },
            "theme": {
                "color": "#D4AF37"
            }
        };
        var rzp1 = new Razorpay(options);
        document.getElementById('rzp-button').onclick = function(e){
            rzp1.open();
            e.preventDefault();
        }
    </script>
</body>
</html>
