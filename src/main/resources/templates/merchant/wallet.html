<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Wallet – EVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background-color: #0c0c0c;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .page-content { padding: 48px 0 80px; }
        .panel-card {
            background: rgba(22,22,22,0.95);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
        }
        .panel-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #c9a84c;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .table-custom { color: rgba(255,255,255,0.85); margin: 0; }
        .table-custom thead th {
            border-bottom: 1px solid rgba(201,168,76,0.2);
            color: #c9a84c;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px;
        }
        .table-custom tbody td {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 16px 14px;
            font-size: 0.9rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="page-content">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="brand-font mb-1" style="color:#c9a84c;">NXL Ledger</h2>
                    <p class="text-white-50 small mb-0">Track your NXL store credits and transaction history.</p>
                </div>
                <a href="/merchant/dashboard" class="btn btn-outline-light rounded-pill px-4">Back to Dashboard</a>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <div class="panel-card text-center py-5">
                        <i class="bi bi-wallet2 text-gold mb-3 d-block" style="font-size: 3rem;"></i>
                        <h5 class="text-white-50 mb-1">Available NXL Balance</h5>
                        <h2 class="fw-bold mb-0" style="color: #2ecc71;" th:text="'₹' + ${#numbers.formatDecimal(walletBalance, 1, 2)}">₹0.00</h2>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="panel-card">
                        <div class="panel-card-title"><i class="bi bi-card-list"></i> Transaction History</div>
                        <div class="table-responsive">
                            <table class="table table-custom">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Description</th>
                                        <th>Reference</th>
                                        <th class="text-end">Amount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="txn : ${transactions}">
                                        <td th:text="${#temporals.format(txn.createdAt, 'dd MMM yyyy HH:mm')}">Date</td>
                                        <td th:text="${txn.description}">Desc</td>
                                        <td><span class="badge bg-secondary" th:text="${txn.referenceType}">Type</span></td>
                                        <td class="text-end fw-bold">
                                            <span th:if="${txn.type == 'CREDIT' || txn.type == 'DEPOSIT'}" class="text-success" th:text="'+₹' + ${#numbers.formatDecimal(txn.amount, 1, 2)}">+₹0</span>
                                            <span th:if="${txn.type == 'DEBIT' || txn.type == 'WITHDRAWAL'}" class="text-danger" th:text="'-₹' + ${#numbers.formatDecimal(txn.amount, 1, 2)}">-₹0</span>
                                        </td>
                                    </tr>
                                    <tr th:if="${transactions == null || transactions.isEmpty()}">
                                        <td colspan="4" class="text-center text-white-50 py-5">No transactions found in the ledger.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
