<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Orders – EVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        /* ── Sticky footer layout ── */
        html, body {
            height: 100%;
        }
        body {
            background-color: #0c0c0c;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main.page-content { padding: 48px 0 80px; flex: 1; }
        .panel-card {
            background: rgba(22,22,22,0.95);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
        }
        .panel-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #c9a84c;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
		.table-custom {
		    color: rgba(255,255,255,0.85);
		    width: 100%;
		    border-collapse: collapse;
		}
        .table-custom thead th {
            border-bottom: 1px solid rgba(201,168,76,0.2);
            color: #c9a84c;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
		.table-custom tbody td {
		    border-bottom: 1px solid rgba(255,255,255,0.09);
		    padding: 16px 14px;
		    font-size: 0.9rem;
		    vertical-align: middle;
		}
        .badge-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
		.table-custom td:last-child {
		    text-align: right;
		}
		.table-custom th,
		.table-custom td {
		    white-space: normal;
		}
		.table-custom td:nth-child(5),
		.table-custom th:nth-child(5) {
		    text-align: right;
		    padding-right: 24px;   /* right side proper spacing */
			padding-left: 10px;    /* left gap reduce */
		    font-weight: 600;
		}
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="page-content">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="brand-font mb-1" style="color:#c9a84c;">Order History</h2>
                    <p class="text-white-50 small mb-0">Track your past wholesale orders and fulfillment status.</p>
                </div>
                <a href="/merchant/dashboard" class="btn btn-outline-light rounded-pill px-4">Back to Dashboard</a>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success rounded-3 mb-4" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger rounded-3 mb-4" th:text="${errorMessage}"></div>

            <div class="panel-card">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Items</th>
                                <th>Savings</th>
                                <th class="text-end" >Total Value</th>
                                <th class="text-center">Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td class="fw-bold text-gold" style="font-size:1.05rem;" th:text="'#' + ${order.id}">#0000</td>
                                <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">Date</td>
                                <td th:text="${order.items.size()} + ' Items'">0 Items</td>
                                <td class="text-success" th:text="'+ ₹' + ${#numbers.formatDecimal(order.totalSavings, 1, 0)}">₹0</td>
								<td th:text="${order.finalAmount != null ? '₹' + #numbers.formatDecimal(order.finalAmount.doubleValue(), 1, 2) : '₹0.00'}"></td>
                                <td class="text-center">
                                    <span class="badge badge-status" style="background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3);"
                                          th:if="${order.orderStatus == 'SUCCESS' || order.orderStatus == 'DELIVERED'}">COMPLETED</span>
                                    <span class="badge badge-status" style="background: rgba(241, 196, 15, 0.1); color: #f1c40f; border: 1px solid rgba(241,196,15,0.3);"
                                          th:if="${order.orderStatus == 'PENDING'}">PENDING</span>
                                    <span class="badge badge-status" style="background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid rgba(231,76,60,0.3);"
                                          th:if="${order.orderStatus == 'FAILED' || order.orderStatus == 'CANCELLED' || order.orderStatus == 'PAYMENT_FAILED'}">FAILED</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/merchant/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">View</a>
                                </td>
                            </tr>
                            <tr th:if="${orders == null || orders.isEmpty()}">
                                <td colspan="7" class="text-center text-white-50 py-5">
                                    <i class="bi bi-box-seam d-block mb-2" style="font-size: 2rem;"></i>
                                    No purchase orders placed yet.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
