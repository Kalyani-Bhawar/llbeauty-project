<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Catalog – EVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background-color: #0c0c0c;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .page-content { padding: 48px 0 80px; }
        .panel-card {
            background: rgba(22,22,22,0.95);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
        }
        .panel-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #c9a84c;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .table-custom { color: rgba(255,255,255,0.85); margin: 0; }
        .table-custom thead th {
            border-bottom: 1px solid rgba(201,168,76,0.2);
            color: #c9a84c;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px;
        }
        .table-custom tbody td {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 16px 14px;
            font-size: 0.9rem;
            vertical-align: middle;
        }
        .btn-gold {
            background: linear-gradient(135deg, #c9a84c 0%, #9e7f2f 100%);
            border: none; color: #111; padding: 10px 24px; border-radius: 50px;
            font-weight: 600; letter-spacing: 1px;
        }
        .btn-gold:hover { background: linear-gradient(135deg, #e2c26d 0%, #c9a84c 100%); color: #111; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="page-content">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="brand-font mb-1" style="color:#c9a84c;">Wholesale Catalog</h2>
                    <p class="text-white-50 small mb-0">Browse and purchase EVA products at wholesale merchant rates.</p>
                </div>
                <a href="/merchant/dashboard" class="btn btn-outline-light rounded-pill px-4">Back to Dashboard</a>
            </div>

            <div class="panel-card">
                <form th:action="@{/merchant/cart/add-bulk}" method="POST">
                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>MRP</th>
                                    <th>Discount</th>
                                    <th>Merchant Price</th>
                                    <th>Stock</th>
                                    <th class="text-end" style="width: 140px;">Quantity</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <img th:src="${product.imageUrl}" style="width:50px; height:50px; object-fit:cover; border-radius:8px;" alt="">
                                            <div class="fw-bold" th:text="${product.name}">Product Name</div>
                                        </div>
                                    </td>
									<td>
									    ₹<span th:text="${product.price}"></span>
									</td>
                                    <td>
                                        <span class="badge" style="background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3);" 
                                              th:text="${product.merchantDiscount} + '% Off'">0% Off</span>
                                    </td>
                                    <td class="fw-bold" style="color: #c9a84c; font-size:1.05rem;" 
                                        th:text="'₹' + ${#numbers.formatDecimal((product.price != null ? product.price : 0) * (1 - (product.merchantDiscount != null ? product.merchantDiscount : 0) / 100.0), 1, 0)}">₹0</td>
                                    <td>
                                        <span th:if="${product.stock > 10}" class="text-success small"><i class="bi bi-check-circle me-1"></i>In Stock</span>
                                        <span th:if="${product.stock > 0 and product.stock <= 10}" class="text-warning small"><i class="bi bi-exclamation-circle me-1"></i>Low Stock</span>
                                        <span th:if="${product.stock == 0}" class="text-danger small"><i class="bi bi-x-circle me-1"></i>Out of Stock</span>
                                    </td>
                                    <td class="text-end">
                                        <input type="number" th:name="'product_' + ${product.id}" class="form-control text-center bg-dark text-white border-secondary rounded-pill" min="0" value="0" th:disabled="${product.stock == 0}">
                                    </td>
                                </tr>
                                <tr th:if="${products.isEmpty()}">
                                    <td colspan="6" class="text-center text-white-50 py-5">No wholesale products available in the catalog.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="d-flex justify-content-end mt-4 pt-3 border-top border-secondary">
                        <button type="submit" class="btn btn-gold px-5 py-2" th:disabled="${products.isEmpty()}">
                            Add to Bulk Cart <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
