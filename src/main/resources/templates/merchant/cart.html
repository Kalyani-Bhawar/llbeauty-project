<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Cart – EVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        /* ── Sticky footer layout ── */
        html, body {
            height: 100%;
        }
        body {
            background-color: #0c0c0c;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main.page-content { padding: 48px 0 80px; flex: 1; }
        .panel-card {
            background: rgba(22,22,22,0.95);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
        }
        .panel-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #c9a84c;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .table-custom {
            color: rgba(255,255,255,0.85);
            margin: 0;
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .table-custom thead th {
            border-bottom: 1px solid rgba(201,168,76,0.2);
            color: #c9a84c;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .table-custom tbody td {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 16px 14px;
            font-size: 0.9rem;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-gold {
            background: linear-gradient(135deg, #c9a84c 0%, #9e7f2f 100%);
            border: none; color: #111; padding: 12px 32px; border-radius: 50px;
            font-weight: 600; letter-spacing: 1px; font-size: 1rem;
        }
        .btn-gold:hover { background: linear-gradient(135deg, #e2c26d 0%, #c9a84c 100%); color: #111; }
        .grand-total-row td {
            border-top: 2px solid rgba(201,168,76,0.4) !important;
            border-bottom: none !important;
            padding-top: 20px !important;
        }
		.table-custom{
		    min-width:1000px;
		}
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="page-content">
		<div class="container" style="max-width:1600px;">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="brand-font mb-1" style="color:#c9a84c;">Bulk Cart</h2>
                    <p class="text-white-50 small mb-0">Review your selected wholesale products before checkout.</p>
                </div>
                <div class="d-flex gap-2">
                    <a href="/merchant/wholesale" class="btn btn-outline-secondary rounded-pill px-4">Back to Catalog</a>
                    <a href="/merchant/dashboard" class="btn btn-outline-light rounded-pill px-4">Dashboard</a>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-title"><i class="bi bi-cart3"></i> Your Cart Items</div>
				<div class="table-responsive">
				<table class="table table-custom align-middle">
				
				    <thead>
				        <tr>
				            <th style="width:45%">Product</th>
				            <th style="width:15%">MRP</th>
				            <th style="width:15%">Price</th>
				            <th style="width:10%" class="text-center">Qty</th>
				            <th style="width:15%" class="text-end">Total</th>
				        </tr>
				    </thead>
				
				    <tbody>
				        <tr th:each="item : ${cartItems}">
				            
				            <!-- PRODUCT -->
				            <td>
				                <div class="d-flex align-items-center gap-3">
				                    <img th:src="${item.product.imageUrl}"
				                         style="width:45px;height:45px;object-fit:cover;border-radius:8px;">
				                    
				                    <div>
				                        <div class="fw-bold" th:text="${item.product.name}"></div>
				                    </div>
				                </div>
				            </td>
				
				            <!-- MRP -->
							<td th:text="${item.mrp}"></td>
				
				            <!-- PRICE -->
				            <td class="fw-bold text-warning"
				                th:text="'₹' + ${#numbers.formatDecimal(item.merchantPrice,0,'COMMA',0,'POINT')}">
				            </td>
				
				            <!-- QTY -->
				            <td class="text-center fw-bold"
				                th:text="${item.quantity}">
				            </td>
				
				            <!-- TOTAL -->
				            <td class="text-end fw-bold text-success"
				                th:text="'₹' + ${#numbers.formatDecimal(item.total,0,'COMMA',0,'POINT')}">
				            </td>
				
				        </tr>
				
				        <tr th:if="${cartItems.isEmpty()}">
				            <td colspan="5" class="text-center text-muted py-5">
				                Cart is empty
				            </td>
				        </tr>
				    </tbody>
				
				</table>
				</div>
                
                <div class="d-flex justify-content-end mt-4 pt-3 border-top border-secondary" th:if="${cartItems != null && !cartItems.isEmpty()}">
                    <a href="/merchant/checkout" class="btn btn-gold px-5 py-2">
                        Proceed to Checkout <i class="bi bi-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
