<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed – EVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .success-container {
            padding: 80px 0;
            background: #fafaf8;
        }
        .success-card {
            background: #fff;
            border-radius: 24px;
            padding: 48px;
            border: 1px solid #f0ebe0;
            box-shadow: var(--shadow-md);
            max-width: 600px;
            margin: 0 auto;
        }
        /* Stylized Golden VIP Ticket */
        .vip-ticket {
            background: linear-gradient(135deg, #1e1e1e 0%, #111 100%);
            border: 2px solid var(--gold);
            border-radius: 16px;
            color: #fff;
            padding: 28px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-gold);
            margin: 30px 0;
        }
        .vip-ticket::before, .vip-ticket::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff; /* Cuts out of the ticket */
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            border: 2px solid var(--gold);
        }
        .vip-ticket::before { left: -14px; }
        .vip-ticket::after { right: -14px; }
        .ticket-dashed-line {
            border-top: 1.5px dashed rgba(201,168,76,0.3);
            margin: 16px 0;
        }
        .token-display {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(201,168,76,0.3);
        }
        @media print {
            .navbar, .footer, .no-print {
                display: none !important;
            }
            .success-container {
                padding: 0;
                background: none;
            }
            .success-card {
                border: none;
                box-shadow: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="success-container">
        <div class="container animate-fade-up">
            
            <div class="success-card text-center">
                <!-- Golden Success Icon -->
                <div class="d-inline-flex align-items-center justify-content-center bg-gold text-white rounded-circle mb-4" 
                     style="width: 72px; height: 72px; font-size: 2.2rem; box-shadow: var(--shadow-gold);">
                    ✓
                </div>
                
                <h2 class="brand-font text-dark mb-2">Booking Confirmed!</h2>
                <p class="text-muted" style="font-size:0.95rem;">Your salon slot has been secured via ₹100 advanced payment.</p>

                <!-- Ticket Card -->
                <div class="vip-ticket mt-4 mb-4 text-start">
                    <div class="row">
                        <div class="col-sm-6">
                            <small class="text-gold" style="font-size:0.75rem; text-transform:uppercase; font-weight:600;">Booking Token</small>
                            <div class="token-display" th:text="${appointment.token}">LL-SLOT-0000</div>
                        </div>
                        <div class="col-sm-6 text-sm-end mt-3 mt-sm-0">
                            <small class="text-gold" style="font-size:0.75rem; text-transform:uppercase; font-weight:600;">Date & Time</small>
                            <div class="fw-bold" style="font-size:1.1rem;" th:text="${appointment.appointmentDate}">YYYY-MM-DD</div>
                            <div class="" style="font-size:0.9rem;" th:text="${appointment.timeSlot}">10:00 AM</div>
                        </div>
                    </div>
                    
                    <div class="ticket-dashed-line"></div>
                    
                    <div class="row">
                        <div class="col-12 mb-3">
                            <small class="text-gold" style="font-size:0.75rem; text-transform:uppercase; font-weight:600;">Services Booked</small>
                            <div class="fw-bold" style="font-size:1rem;" th:text="${appointment.services}">Hair Care</div>
                        </div>
                        <div class="col-4">
                            <small class="text-gold" style="font-size:0.75rem; text-transform:uppercase; font-weight:600;">Total</small>
                            <div class="fw-bold" style="font-size:1rem;">₹<span th:text="${appointment.totalAmount ?: '0.0'}"></span></div>
                        </div>
                        <div class="col-4">
                            <small class="text-gold" style="font-size:0.75rem; text-transform:uppercase; font-weight:600;">Advance Paid</small>
                            <div class="fw-bold" style="font-size:1rem; color:#28a745;">₹<span th:text="${appointment.advancePaid ?: '0.0'}"></span></div>
                        </div>
                        <div class="col-4">
                            <small class="text-gold" style="font-size:0.75rem; text-transform:uppercase; font-weight:600;">Pending</small>
                            <div class="fw-bold" style="font-size:1rem; color:#dc3545;">₹<span th:text="${(appointment.totalAmount ?: 0.0) - (appointment.advancePaid ?: 0.0)}"></span></div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/salon/receipt/{id}(id=${appointment.id})}" target="_blank" class="btn-gold rounded-pill px-4">
                        <i class="bi bi-file-earmark-pdf me-2"></i> Download Receipt
                    </a>
                </div>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
