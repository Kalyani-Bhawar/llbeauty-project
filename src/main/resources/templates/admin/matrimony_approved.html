<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::div})}">
<head>
    <title>Approved Matrimony Profiles</title>
</head>
<body>
    <div>
        <h3 class="page-title">Approved Matrimony Profiles</h3>
        <p class="page-subtitle">Browse and manage active verified matrimonial profiles in the circle.</p>

        <!-- Alert boxes -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="data-card">
            <div class="data-card-header d-flex justify-content-between align-items-center">
                <h6>Approved Profiles</h6>
                <a href="/admin/matrimony/pending" class="btn btn-sm btn-gold rounded-pill">
                    <i class="bi bi-hourglass-split me-1"></i> View Pending
                </a>
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>DOB / Age</th>
                            <th>Gender</th>
                            <th>City / State</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${approvedProfiles}">
                            <td th:text="${p.user.id}">123</td>
                            <td>
                                <span class="fw-bold text-white" th:text="${p.fullName}">Name</span><br>
                                <small style="color:#aaa;" th:text="${p.user.email}"></small>
                            </td>
                            <td>
                                <span th:text="${p.dateOfBirth}">DOB</span><br>
                                <small style="color:#aaa;" th:text="${T(java.time.Period).between(p.dateOfBirth, T(java.time.LocalDate).now()).getYears()} + ' yrs'"></small>
                            </td>
                            <td th:text="${p.gender}">Gender</td>
                            <td th:text="${p.city} + ', ' + ${p.state}">City, State</td>
                            <td>
                                <span class="badge bg-success">APPROVED</span>
                            </td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/admin/matrimony/profile-view/{id}(id=${p.user.id})}" class="btn btn-sm btn-info" title="Inspect Profile">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                    <form th:action="@{/admin/matrimony/block/{id}(id=${p.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Block Profile" onclick="return confirm('Block this profile?');">
                                            <i class="bi bi-slash-circle"></i> Block
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(approvedProfiles)}">
                            <td colspan="7">
                                <div class="empty-state">
                                    <i class="bi bi-inbox"></i>
                                    No approved matrimony profiles found.
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
