<!DOCTYPE html>
<html th:replace="~{admin/layout :: layout(~{::div.content})}" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="content">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-start mb-5">
            <div>
                <h1 class="page-title mb-1">Salon Services</h1>
                <div class="page-subtitle">Dynamically manage services offered in EVA salon.</div>
            </div>
            <a href="/admin/salon-services/new" class="btn btn-sm btn-gold px-4 py-2" style="font-size:0.85rem; border-radius: 8px;">
                <i class="bi bi-plus-circle-fill me-1"></i> Add Service
            </a>
        </div>

        <!-- Success/Error Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 rounded-3 mb-4" style="background: rgba(46,204,113,0.15); color: #2ecc71;">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 rounded-3 mb-4" style="background: rgba(231,76,60,0.15); color: #e74c3c;">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Services Card -->
        <div class="data-card">
			<div class="data-card-header">
			    <h6>
			        <i class="bi bi-scissors me-2"
			           style="color:#c9a84c;"></i>
			        Services Offered
			    </h6>
			
			    <span class="badge bg-dark"
			          th:text="${services.size()} + ' Services'">
			        0 Services
			    </span>
			</div>
            <div class="table-responsive">
                <table class="table mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Service Name</th>
                            <th>Price</th>
                            <th>Duration</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
					<tbody>
					
					<tr th:each="srv : ${services}">
					
						<td class="text-center"
						    style="font-weight:600;color:#333;"
						    th:text="${srv.id}">
						</td>
					    <td>
					        <div style="font-weight:600;font-size:0.88rem;color:#222;"
					             th:text="${srv.name}">
					        </div>
					    </td>
					
						<td class="text-nowrap">
						    <span style="font-weight:700;color:#c9a84c;"
						          th:text="'₹'+${srv.price}">
						    </span>
						</td>
					
					    <td style="font-size:0.83rem;color:#333;"
					        th:text="${srv.durationMinutes} + ' mins'">
					    </td>
					
						<td>
							<div style="
							max-width:300px;
							color:#333;
							font-size:0.85rem;
							line-height:1.5;
							"
						    th:text="${srv.description}">
						    </div>
						</td>
					
					    <td>
					        <span class="badge bg-success"
					              th:if="${srv.active}">
					            Active
					        </span>
					
					        <span class="badge bg-secondary"
					              th:unless="${srv.active}">
					            Inactive
					        </span>
					    </td>
					
					    <td>
					        <div class="d-flex gap-2 flex-wrap">
					
								<a th:href="@{/admin/salon-services/edit/{id}(id=${srv.id})}"
								   class="btn btn-sm btn-outline-info btn-action">
					                <i class="bi bi-pencil"></i> Edit
					            </a>
					
					            <form th:if="${srv.active}"
					                  th:action="@{/admin/salon-services/deactivate/{id}(id=${srv.id})}"
					                  method="POST"
					                  class="d-inline">
					
									  <button type="submit"
									          class="btn btn-sm btn-outline-warning btn-action"
									          onclick="return confirm('Deactivate this service?')">
					                    <i class="bi bi-eye-slash"></i>
					                    Deactivate
					                </button>
					            </form>
					
					            <form th:unless="${srv.active}"
					                  th:action="@{/admin/salon-services/activate/{id}(id=${srv.id})}"
					                  method="POST"
					                  class="d-inline">
					
									  <button type="submit"
									          class="btn btn-sm btn-outline-success btn-action">
					                    <i class="bi bi-eye"></i>
					                    Activate
					                </button>
					            </form>
					
					            <form th:action="@{/admin/salon-services/delete/{id}(id=${srv.id})}"
					                  method="POST"
					                  class="d-inline">
					
									  <button type="submit"
									          class="btn btn-sm btn-outline-danger btn-action"
									          onclick="return confirm('Delete this service permanently?')">
					                    <i class="bi bi-trash3"></i>
					                    Delete
					                </button>
					            </form>
					
					        </div>
					    </td>
					
					</tr>
					
					<tr th:if="${#lists.isEmpty(services)}">
					    <td colspan="7" class="empty-state">
					        <i class="bi bi-scissors"></i>
					        No services found.
					    </td>
					</tr>
					
					</tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
