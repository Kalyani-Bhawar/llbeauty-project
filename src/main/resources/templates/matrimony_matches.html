<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Matches – EVA Matrimony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
	<link href="/css/matrimony.css" rel="stylesheet">
    <style>
        .matches-page {
            background-color: #0c0c0c;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .matches-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(201, 168, 76, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            margin: 60px auto;
            max-width: 900px;
            width: 100%;
        }
        .match-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }
        .match-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
        }
    </style>
</head>
<body class="eva-matrimony matches-page">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container flex-grow-1 py-4">
        <div class="matches-card animate-fade-up">

            <h3 class="brand-font text-gold mb-4 text-center">My Matches</h3>

            <!-- If empty -->
            <div class="text-center py-5" th:if="${#lists.isEmpty(matches)}">
                <span style="font-size: 3.5rem;">🤝</span>
                <h5 class="brand-font text-gold mt-3">No Mutual Matches</h5>
                <p class="text-white-50">Mutual matches appear here when you accept a request or when someone accepts your interest.</p>
                <a href="/matrimony/search" class="btn-gold rounded-pill px-4 mt-3">Search Partners</a>
            </div>

            <!-- Match Rows -->
            <div th:each="m : ${matches}" class="match-row">
                <div class="d-flex align-items-center gap-3">
                    <!-- Partner Image and Info depending on UserOne / UserTwo relationship -->
                    <th:block th:with="partner=${m.userOne.id == currentUser.id ? m.userTwo : m.userOne}">
                        <!-- Just show a standard placeholder or name initials/details -->
                        <div class="d-flex align-items-center gap-3">
                            <div>
                                <h5 class="brand-font mb-1 text-gold" th:text="${partner.name}">Partner Name</h5>
                                <span class="small text-white-50">Matched on: </span>
                                <span class="small text-white-50 fw-bold" th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy')}">Date</span>
                            </div>
                        </div>
                    </th:block>
                </div>
                
                <div class="d-flex gap-2">
                    <a th:href="@{/matrimony/chat(matchId=${m.id})}" class="btn btn-gold rounded-pill px-4">
                        <i class="bi bi-chat-dots-fill me-1"></i> Chat Now
                    </a>
                </div>
            </div>

            <!-- Footer Action link -->
            <div class="text-center mt-5">
                <a href="/matrimony" class="btn btn-outline-light px-4 rounded-pill">
                    <i class="bi bi-arrow-left me-1"></i> Back to Matrimony
                </a>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
